<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task board</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 36rem; color: #172033; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    li { margin: 0.4rem 0; }
    .muted { color: #667085; }
  </style>
</head>
<body>
  <h1>Task board</h1>
  <p class="muted">Demo logins: admin/admin sees every task. member/member sees only their own.</p>
  <form id="login">
    <input name="username" placeholder="username" required />
    <input name="password" type="password" placeholder="password" required />
    <button>Sign in</button>
  </form>
  <form id="add" hidden>
    <input name="title" placeholder="New task" required />
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    let token = "";
    const list = document.querySelector("#list");
    document.querySelector("#login").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      const body = await res.json();
      if (!res.ok) return alert(body.error);
      token = body.token;
      event.target.hidden = true;
      document.querySelector("#add").hidden = false;
      load();
    };
    document.querySelector("#add").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      await fetch("/api/tasks", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify(data) });
      event.target.reset();
      load();
    };
    async function load() {
      const res = await fetch("/api/tasks", { headers: { authorization: "Bearer " + token } });
      const body = await res.json();
      list.innerHTML = body.tasks.map((task) => `<li>${task.title} <span class="muted">(${task.owner})</span></li>`).join("");
    }
  </script>
</body>
</html>
